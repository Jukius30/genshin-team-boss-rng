<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Square -->
  <rect width="64" height="64" rx="14" fill="#090B10" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Subtle Outer Constellation Ring -->
  <circle cx="32" cy="32" r="21" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Rotated Diamond Frame -->
  <rect x="32" y="13" width="26.87" height="26.87" transform="rotate(45 32 13)" stroke="#D4AF37" stroke-opacity="0.7" stroke-width="1.5" />

  <!-- Four-Pointed Teyvat Star Core -->
  <path d="M32 14C32.8 25.5 38.5 31.2 50 32C38.5 32.8 32.8 38.5 32 50C31.2 38.5 25.5 32.8 14 32C25.5 31.2 31.2 25.5 32 14Z" fill="url(#goldGrad)" />

  <!-- Center Core Dot -->
  <circle cx="32" cy="32" r="2.2" fill="#090B10" />

  <defs>
    <linearGradient id="goldGrad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7E1E" />
    </linearGradient>
  </defs>
</svg>